<title>Pare Feels Like Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@500;600&display=swap">
<style>

:root {
  color-scheme: light;
  --bg: #FFF3F8;
  --bg-top: #FFE3EF;
  --surface: #FFFFFF;
  --ink: #3B2142;
  --muted: #86708F;
  --outline: #C2528C;
  --line: #F8D3E4;
  --accent: #FF3D8B;
  --accent-2: #FF2E6E;
  --pink-soft: #FFD9E8;
  --sun: #FFD84D;
  --sky: #BFE6FF;
  --lilac: #E7DBFF;
  --mint: #CFF4E3;
  --mail-red: #FF6FA6;
  --mail-blue: #8CCBF5;
  --glow: rgba(255, 61, 139, .22);
  --font-display: "Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px, #FFFFFF 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6; font-weight: 600;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.04; margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* svg doodle classes */
.line { stroke: var(--outline); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.line.thin { stroke-width: 2; }
.fa { fill: var(--sun); } .fp { fill: var(--pink-soft); } .fi { fill: var(--ink); } .fs { fill: var(--surface); } .fk { fill: var(--sky); } .fh { fill: var(--accent); } .fl { fill: var(--lilac); }

.sticker { display: inline-flex; align-items: center; gap: 8px; width: fit-content; background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
  padding: 5px 16px 5px 12px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--accent); box-shadow: 0 6px 18px var(--glow); transform: rotate(-1.5deg); }
.sticker::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.screen { display: flex; flex-direction: column; gap: 28px; min-width: 0; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ride { from { transform: translateX(-30vw); } to { transform: translateX(110%); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-8px) rotate(var(--r, 0deg)); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; width: fit-content;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #FFFFFF; border: 0; border-radius: 999px;
  padding: 14px 32px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; box-shadow: 0 10px 24px var(--glow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 30px var(--glow); }
.btn:active { transform: translateY(1px) scale(.96); }
.btn.ghost { background: var(--surface); color: var(--accent); border: 2px solid var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--accent); box-shadow: 0 8px 20px var(--glow); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; width: fit-content; font-weight: 800; }
.back:hover { color: var(--accent); }

/* particles */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.p { position: absolute; width: 18px; height: 18px; will-change: transform, opacity; }
.p svg { width: 100%; height: 100%; display: block; }
.p.dot { width: 10px; height: 10px; border-radius: 50%; }
.p.c1 { background: var(--sun); } .p.c2 { background: var(--sky); } .p.c3 { background: var(--lilac); } .p.c4 { background: var(--accent); border-radius: 3px; }

/* progress road */
.track { position: relative; height: 52px; margin-bottom: -6px; }
.track .road { position: absolute; left: 0; right: 40px; bottom: 10px; border-top: 4px dashed var(--pink-soft); }
.track .bike { position: absolute; bottom: 12px; left: 0; width: 56px; transition: left 1.1s cubic-bezier(.5, 0, .2, 1); }
.track .house { position: absolute; right: 0; bottom: 8px; width: 48px; }
.track .house.arrived { animation: beat .9s ease-in-out 3; }

/* home */
.home { min-height: 72vh; justify-content: center; gap: 30px; position: relative; overflow: hidden; padding-block: 8px; }
.home h1 { font-size: clamp(2.7rem, 10vw, 5.8rem); max-width: 11ch; }
.home h1 .w { display: inline-block; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); cursor: default; }
.home h1 .w:hover { transform: translateY(-8px) rotate(-4deg); }
.home h1 em { font-style: normal; display: inline-block; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sun { position: absolute; top: 0; right: -4px; width: clamp(96px, 22vw, 170px); animation: bob 3.2s ease-in-out infinite; background: none; border: 0; padding: 0; cursor: pointer; }
.sun svg { display: block; width: 100%; transition: transform .2s ease; }
.sun:hover svg { transform: scale(1.08) rotate(-4deg); }
.sun:active svg { transform: scale(.94); }
.sun .rays { transform-origin: 60px 60px; animation: spin 24s linear infinite; }
.poke { position: absolute; top: clamp(98px, 24vw, 178px); right: 10px; font-family: var(--font-hand); font-size: 1.5rem; color: var(--accent); transform: rotate(6deg); pointer-events: none; }
.bubble { position: absolute; top: clamp(130px, 30vw, 210px); right: 8px; max-width: 200px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px 6px 20px 20px; padding: 8px 14px;
  font-family: var(--font-display); font-weight: 600; color: var(--ink); box-shadow: 0 8px 22px var(--glow); animation: pop .3s cubic-bezier(.2, 1.6, .4, 1) both; z-index: 5; }
.heart { position: absolute; width: 34px; animation: bob 2.6s ease-in-out infinite; pointer-events: none; }
.heart.h1 { top: 34%; right: 10%; --r: 12deg; } .heart.h2 { top: 58%; right: 26%; width: 22px; --r: -14deg; animation-delay: .6s; }
.ground { position: relative; height: 70px; margin-top: 6px; }
.ground .road { position: absolute; left: 0; right: 0; bottom: 6px; border-top: 4px dashed var(--pink-soft); }
.ground .bike { position: absolute; bottom: 8px; left: 0; width: 120px; animation: ride 9s linear infinite; }

/* choose */
.page-head { display: flex; flex-direction: column; gap: 12px; }
.choose h2, .page-head h2 { font-size: clamp(2.1rem, 7vw, 3.4rem); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 22px; }
.option {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 14px 34px var(--glow);
  padding: 26px 24px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: transform .2s ease, border-color .2s ease;
}
.option:nth-child(1) { transform: rotate(-1.2deg); } .option:nth-child(2) { transform: rotate(1.2deg); }
.option:hover { border-color: var(--accent); }
.option h3 { font-size: 2.1rem; }
.option p { color: var(--muted); }
.option .go { font-family: var(--font-display); font-weight: 700; margin-top: 6px; color: var(--accent); }
.option .ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; transition: transform .3s cubic-bezier(.3, 1.8, .5, 1); }
.option:hover .ic { transform: rotate(-10deg) scale(1.15); }
.option:nth-child(1) .ic { background: var(--sky); } .option:nth-child(2) .ic { background: var(--lilac); }
.option .ic svg { width: 40px; height: 40px; }

/* photos: white polaroid frames */
.photo { position: relative; width: 100%; background: var(--surface); border: 8px solid var(--surface); border-radius: 14px; box-shadow: 0 12px 30px var(--glow), 0 0 0 1.5px var(--line); max-width: 100%; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.photo.ph { display: grid; place-items: center; color: var(--accent); font-family: var(--font-display); font-size: 15px; text-align: center; padding: 12px;
  background: repeating-linear-gradient(45deg, #FFF0F6 0 14px, #FFE1EE 14px 28px); }
.photo::before { content: ""; position: absolute; top: -18px; left: 50%; width: 84px; height: 24px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255, 190, 215, .8); border-radius: 4px; z-index: 2; }
.wide { aspect-ratio: 16 / 10; transform: rotate(-1deg); }
.tall { aspect-ratio: 4 / 5; }

/* envelope */
.lb { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.env { position: relative; display: block; width: min(440px, 100%); aspect-ratio: 3 / 2; margin-inline: auto; padding: 0; border: 0; background: none; cursor: pointer;
  filter: drop-shadow(0 14px 22px var(--glow)); perspective: 900px; animation: bob 3s ease-in-out infinite; }
.env .back { position: absolute; inset: 0; background: #FFB3D1; border-radius: 12px; }
.env .flap { position: absolute; left: 0; right: 0; top: 0; height: 56%; background: #FF8FBE; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s ease; z-index: 3; border-radius: 12px 12px 0 0; }
.env .front { position: absolute; inset: 0; background: #FFD0E3; clip-path: polygon(0 100%, 0 14%, 50% 62%, 100% 14%, 100% 100%); z-index: 2; border-radius: 12px; }
.env .seal { position: absolute; left: 50%; top: 52%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; z-index: 4; transition: opacity .3s ease, transform .3s ease; animation: beat 1.6s ease-in-out infinite; }
.env .seal svg { width: 26px; }
.env .seal .fh { fill: #FFFFFF; }
.env .for { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--accent); z-index: 4; padding: 0 12px; overflow-wrap: anywhere; }
.env:hover .flap { transform: rotateX(28deg); }
.env.open .flap { transform: rotateX(180deg); z-index: 1; }
.env.open .seal { opacity: 0; transform: scale(.3); }
.env-hint { text-align: center; font-family: var(--font-hand); font-size: 1.6rem; color: var(--accent); }

/* letter: pink and sky airmail border + stamp */
.letter-wrap { padding: 10px; border-radius: 12px; box-shadow: 0 14px 34px var(--glow); transform: rotate(.6deg); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  background: repeating-linear-gradient(135deg, var(--mail-red) 0 16px, var(--surface) 16px 24px, var(--mail-blue) 24px 40px, var(--surface) 40px 48px); }
.letter { position: relative; background: var(--surface); border-radius: 6px; padding: clamp(20px, 5vw, 38px); min-width: 0; }
.letter .to { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--accent); margin-bottom: 14px; padding-right: 96px; }
.letter .body { display: grid; font-family: var(--font-hand); font-size: clamp(1.45rem, 4.6vw, 1.85rem); line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; font-weight: 500; cursor: pointer; }
.letter .body .ghost, .letter .body .typed { grid-area: 1 / 1; }
.letter .body .ghost { visibility: hidden; }
.stamp { position: absolute; top: 14px; right: 14px; width: 74px; padding: 6px; border: 2.5px dashed var(--accent); border-radius: 6px; background: #FFF3F8; transform: rotate(6deg); }
.stamp svg { display: block; width: 100%; }
.stamp small { display: block; text-align: center; font-family: var(--font-display); font-size: 10px; letter-spacing: .12em; color: var(--accent); }

/* camp */
.names { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 7px 18px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--ink); transition: transform .15s ease, border-color .15s ease; }
.chip:hover { transform: translateY(-3px) rotate(-2deg); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #FFFFFF; border-color: transparent; box-shadow: 0 8px 18px var(--glow); }

/* room grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 32px 22px; }
.person { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: transform .2s ease; }
.person:nth-child(odd) { transform: rotate(-2deg); } .person:nth-child(even) { transform: rotate(1.8deg); }
.person:hover { transform: rotate(0) translateY(-6px) scale(1.03); }
.person .name { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.person .hint { align-self: flex-start; font-size: 13px; font-weight: 800; background: var(--pink-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; margin-top: -6px; }

.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(255, 226, 239, .86); backdrop-filter: blur(6px); display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .sheet { width: min(580px, 100%); display: flex; flex-direction: column; gap: 16px; max-height: 100%; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.overlay .close { align-self: flex-end; background: var(--surface); color: var(--accent); border: 2px solid var(--line); border-radius: 999px; padding: 6px 20px; font-family: var(--font-display); font-weight: 700; cursor: pointer; }
.overlay .close:hover { border-color: var(--accent); }

/* address */
form { display: grid; gap: 18px; max-width: 580px; background: var(--surface); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 14px 34px var(--glow); padding: clamp(18px, 4vw, 30px); }
label { display: grid; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
label span.opt { font-family: var(--font-body); font-weight: 600; color: var(--muted); font-size: .9rem; }
input, textarea { background: #FFF8FB; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; width: 100%; min-width: 0; font-weight: 600; }
textarea { resize: vertical; min-height: 96px; }
input:focus, textarea:focus { outline: none; background: #FFFFFF; border-color: var(--accent); box-shadow: 0 0 0 4px var(--pink-soft); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.status { padding: 16px 18px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 10px 26px var(--glow); max-width: 580px; }
.status.ok { background: #FFF0F6; border-color: var(--accent); }
.status pre { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* finale */
.finale { gap: 32px; }
.finale h2 { font-size: clamp(2.3rem, 8vw, 4.4rem); }
.finale .msg { font-family: var(--font-hand); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.3; white-space: pre-line; max-width: 34ch; font-weight: 600; }
.player { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.player .t { color: var(--muted); font-weight: 800; }
.eqbars { display: inline-flex; align-items: flex-end; gap: 3px; height: 26px; }
.eqbars i { width: 5px; height: 100%; background: var(--accent); border-radius: 3px; transform: scaleY(.25); transform-origin: bottom; }
.eqbars.on i { animation: eq .8s ease-in-out infinite; }
.eqbars.on i:nth-child(2) { animation-delay: .15s; } .eqbars.on i:nth-child(3) { animation-delay: .3s; } .eqbars.on i:nth-child(4) { animation-delay: .45s; }
.confetti { display: flex; gap: 10px; flex-wrap: wrap; }
.confetti i { width: 16px; height: 16px; border-radius: 50%; animation: bob 1.6s ease-in-out infinite; }
.confetti i:nth-child(4n) { background: var(--accent); } .confetti i:nth-child(4n+1) { background: var(--sun); border-radius: 4px; animation-delay: .2s; }
.confetti i:nth-child(4n+2) { background: var(--sky); animation-delay: .4s; } .confetti i:nth-child(4n+3) { background: var(--lilac); border-radius: 4px; animation-delay: .6s; }
</style>

<script>

   photo / music diisi alamat file setelah diunggah ('' = tampil kotak kosong). */

  campPhoto: '',
  campmates: [
    { name: 'Campmate 1', letter: 'Dear Campmate 1,\n\n(Contoh) Tulis letter khusus untuk dia di sini.\n\nWith love,\nAku' },
    { name: 'Campmate 2', letter: 'Dear Campmate 2,\n\n(Contoh) Tulis letter khusus untuk dia di sini.\n\nWith love,\nAku' },
    { name: 'Campmate 3', letter: 'Dear Campmate 3,\n\n(Contoh) Tulis letter khusus untuk dia di sini.\n\nWith love,\nAku' }
  ],
  roommates: [
    { name: 'Roommate 1', photo: '', letter: 'Dear Roommate 1,\n\n(Contoh) Tulis letter pribadi untuk dia di sini.\n\nWith love,\nAku' },
    { name: 'Roommate 2', photo: '', letter: 'Dear Roommate 2,\n\n(Contoh) Tulis letter pribadi untuk dia di sini.\n\nWith love,\nAku' },
    { name: 'Roommate 3', photo: '', letter: 'Dear Roommate 3,\n\n(Contoh) Tulis letter pribadi untuk dia di sini.\n\nWith love,\nAku' }

const app = document.getElementById('app');
const state = { group: 'camp', camp: 0, prog: 0, opened: new Set() };
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* doodles (static markup, colors come from CSS tokens) */
const SUN = '<svg viewBox="0 0 120 120" aria-hidden="true"><g class="rays line"><path d="M94 60h14M84 84l10 10M60 94v14M36 84l-10 10M26 60H12M36 36l-10-10M60 26V12M84 36l10-10"/></g><circle class="fa line" cx="60" cy="60" r="26"/><circle class="fs line thin" cx="51" cy="56" r="6"/><circle class="fs line thin" cx="69" cy="56" r="6"/><circle class="pupil fi" cx="51" cy="56" r="3"/><circle class="pupil fi" cx="69" cy="56" r="3"/><path class="line" d="M50 68q10 10 20 0"/><circle class="fh" cx="42" cy="67" r="4.5" opacity=".45"/><circle class="fh" cx="78" cy="67" r="4.5" opacity=".45"/></svg>';
const BIKE = '<svg viewBox="0 0 160 90" aria-hidden="true"><circle class="fs line" cx="35" cy="62" r="22"/><circle class="fs line" cx="125" cy="62" r="22"/><path class="line" d="M35 62L60 32L68 62L35 62M60 32L110 30L68 62M110 30L125 62M52 28h16M104 24l14-2M110 30l-2-6"/><rect class="fp line" x="112" y="34" width="18" height="12" rx="3"/></svg>';
const HOUSE = '<svg viewBox="0 0 60 60" aria-hidden="true"><path class="fp line" d="M5 30L30 7l25 23z"/><rect class="fs line" x="11" y="30" width="38" height="24" rx="3"/><rect class="fh" x="25" y="38" width="10" height="16" rx="2"/><circle class="fa" cx="19" cy="40" r="3.5"/><circle class="fa" cx="41" cy="40" r="3.5"/></svg>';
const TENT = '<svg viewBox="0 0 64 64" aria-hidden="true"><path class="fs line" d="M6 52L32 10l26 42z"/><path class="fp line" d="M24 52l8-16 8 16z"/></svg>';
const BED = '<svg viewBox="0 0 64 64" aria-hidden="true"><path class="fs line" d="M6 50V22M6 40h52v10M58 40v-8a8 8 0 0 0-8-8H24v16"/><circle class="fp line" cx="15" cy="32" r="6"/></svg>';
const SMALLSUN = '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="fa line" cx="60" cy="60" r="30"/><circle class="fi" cx="50" cy="55" r="4"/><circle class="fi" cx="70" cy="55" r="4"/><path class="line" d="M48 68q12 12 24 0"/></svg>';
const HEART = '<svg viewBox="0 0 32 30" aria-hidden="true"><path class="fh" d="M16 29C6 21 1 15 1 9a7.5 7.5 0 0 1 15-2 7.5 7.5 0 0 1 15 2c0 6-5 12-15 20z"/></svg>';
const svg = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstChild; };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

/* ---------- effects ---------- */
const fx = h('div', { class: 'fx', 'aria-hidden': 'true' });
document.body.append(fx);
function burst(x, y, n = 12) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const isHeart = Math.random() < 0.6;
    const p = isHeart ? h('div', { class: 'p' }) : h('div', { class: 'p dot c' + (1 + Math.floor(Math.random() * 4)) });
    if (isHeart) p.append(svg(HEART));
    p.style.left = x + 'px'; p.style.top = y + 'px';
    fx.append(p);
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 110;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const rot = (Math.random() - 0.5) * 120;
    p.animate([
      { transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7 - 30}px)) scale(1.1) rotate(${rot / 2}deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 60}px)) scale(.7) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
  }
}
function burstAt(el, n) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn,.chip,.option,.person');
  if (b && !b.disabled) burst(e.clientX, e.clientY, 7);
});
/* cards tilt toward the pointer */
app.addEventListener('pointermove', e => {
  if (reduce || e.pointerType === 'touch') return;
  const o = e.target.closest('.option'); if (!o) return;
  const r = o.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
  o.style.transform = `perspective(700px) rotateY(${px * 12}deg) rotateX(${-py * 12}deg) translateY(-6px) scale(1.02)`;
});
app.addEventListener('pointerout', e => {
  const o = e.target.closest('.option');
  if (o && !o.contains(e.relatedTarget)) o.style.transform = '';
});
/* the sun's eyes follow the pointer */
let look = 0;
document.addEventListener('pointermove', e => {
  if (look) return;
  look = requestAnimationFrame(() => {
    look = 0;
    document.querySelectorAll('.sun svg').forEach(s => {
      const r = s.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy) || 1, k = Math.min(2.6, d / 60);
      s.querySelectorAll('.pupil').forEach(p => p.setAttribute('transform', `translate(${(dx / d * k).toFixed(2)} ${(dy / d * k).toFixed(2)})`));
    });
  });
});

/* ---------- pieces ---------- */
function photo(src, cls, alt, label) {
  if (src) { const d = h('div', { class: 'photo ' + cls }); d.append(h('img', { src, alt, loading: 'lazy' })); return d; }
  return h('div', { class: 'photo ph ' + cls, role: 'img', 'aria-label': alt }, label || 'foto');
}
function progress(n) {
  const p = n / 4;
  const bike = h('div', { class: 'bike' }, svg(BIKE));
  const house = h('div', { class: 'house' + (n === 4 ? ' arrived' : '') }, svg(HOUSE));
  bike.style.left = `calc((100% - 108px) * ${state.prog})`;
  const el = h('div', { class: 'track', role: 'progressbar', 'aria-label': 'Perjalanan pulang', 'aria-valuemin': '0', 'aria-valuemax': '4', 'aria-valuenow': String(n) }, h('div', { class: 'road' }), bike, house);
  requestAnimationFrame(() => requestAnimationFrame(() => { bike.style.left = `calc((100% - 108px) * ${p})`; }));
  state.prog = p;
  return el;
}
function envelope(name) {
  return h('button', { class: 'env', type: 'button', 'aria-label': 'Buka amplop untuk ' + name },
    h('div', { class: 'back' }), h('div', { class: 'front' }), h('div', { class: 'flap' }),
    h('div', { class: 'seal' }, svg(HEART)), h('div', { class: 'for' }, 'Untuk ' + name));
}
function typewrite(el, text, card) {
  if (reduce) { el.textContent = text; return; }
  let i = 0;
  const step = Math.max(14, Math.min(45, 2800 / Math.max(text.length, 1)));
  const t = setInterval(() => {
    if (!el.isConnected) { clearInterval(t); return; }
    i++; el.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(t);
  }, step);
  card.addEventListener('click', () => { clearInterval(t); el.textContent = text; }, { once: true });
}
function letterBlock(key, name, text) {
  const box = h('div', { class: 'lb' });
  const showLetter = animate => {
    const typed = h('span', { class: 'typed', 'aria-hidden': 'true' });
    const body = h('div', { class: 'body' }, h('span', { class: 'ghost', 'aria-hidden': 'true' }, text), typed, h('span', { class: 'sr' }, text));
    const stamp = h('div', { class: 'stamp', 'aria-hidden': 'true' }, svg(SMALLSUN), h('small', null, 'PARE'));
    const card = h('div', { class: 'letter-wrap' }, h('div', { class: 'letter' }, stamp, h('div', { class: 'to' }, 'Untuk ' + name), body));
    let hugs = 0;
    const hug = h('button', { class: 'btn ghost', type: 'button' }, 'Peluk virtual');
    hug.addEventListener('click', () => { hugs++; hug.textContent = 'Peluk virtual ×' + hugs; burstAt(hug, 16); });
    box.replaceChildren(card, h('div', { class: 'actions' }, hug));
    if (animate) typewrite(typed, text, card); else typed.textContent = text;
  };
  if (state.opened.has(key)) { showLetter(false); return box; }
  const env = envelope(name);
  env.addEventListener('click', () => {
    env.classList.add('open'); burstAt(env, 14);
    setTimeout(() => { state.opened.add(key); showLetter(true); }, reduce ? 0 : 650);
  }, { once: true });
  box.append(env, h('p', { class: 'env-hint' }, 'Ketuk amplopnya, ada isinya!'));
  return box;
}
function go(view) {
  app.replaceChildren(view());
  window.scrollTo(0, 0);
  const t = app.querySelector('h1, h2'); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
}
const back = (label, to) => h('button', { class: 'back', type: 'button', onclick: () => go(to) }, '← ' + label);

/* ---------- screens ---------- */
const SUN_LINES = ['Halo, selamat pagi!', 'Udah sarapan belum?', 'Pare panas, tapi hatimu adem.', 'Kangen kelas pagi ya?', 'Awas, jangan telat masuk kelas!', 'Aku iri, kamu punya teman sebaik ini.'];
function homeView() {
  state.prog = 0;
  const sun = h('button', { class: 'sun', type: 'button', 'aria-label': 'Colek matahari' }, svg(SUN));
  const home = h('section', { class: 'screen home' });
  let bubble = null, line = 0;
  sun.addEventListener('click', () => {
    burstAt(sun, 18);
    if (bubble) bubble.remove();
    bubble = h('div', { class: 'bubble', role: 'status' }, SUN_LINES[line++ % SUN_LINES.length]);
    home.append(bubble);
    const mine = bubble; setTimeout(() => { if (mine.isConnected) mine.remove(); }, 2600);
  });
  const hearts = [h('div', { class: 'heart h1', 'aria-hidden': 'true' }, svg(HEART)), h('div', { class: 'heart h2', 'aria-hidden': 'true' }, svg(HEART))];
  const title = h('h1', null);
  'For the people who made Pare feels like'.split(' ').forEach(w => title.append(h('span', { class: 'w' }, w), ' '));
  const em = h('em', null, 'Home');
  title.append(em);
  const ground = h('div', { class: 'ground', 'aria-hidden': 'true' }, h('div', { class: 'road' }), h('div', { class: 'bike' }, svg(BIKE)));
  home.append(sun, h('span', { class: 'poke', 'aria-hidden': 'true' }, 'colek aku!'), ...hearts,
    h('p', { class: 'sticker' }, 'Pare, Kediri · bangun pagi demi kelas'),
    title,
    h('button', { class: 'btn', type: 'button', onclick: () => go(chooseView) }, 'Start →'),
    ground);
  return home;
}

function chooseView() {
  return h('section', { class: 'screen choose' },
    progress(1),
    back('Kembali', homeView),
    h('div', { class: 'page-head' }, h('p', { class: 'sticker' }, 'Eits, pilih dulu'), h('h2', null, 'Kamu tim yang mana?')),
    h('div', { class: 'options' },
      h('button', { class: 'option', type: 'button', onclick: () => { state.group = 'camp'; go(campView); } },
        h('div', { class: 'ic' }, svg(TENT)), h('h3', null, 'Campmates'), h('p', null, 'Rame-rame! Satu foto bareng kita semua, plus satu letter untuk tiap orang.'), h('span', { class: 'go' }, 'Buka →')),
      h('button', { class: 'option', type: 'button', onclick: () => { state.group = 'room'; go(roomView); } },
        h('div', { class: 'ic' }, svg(BED)), h('h3', null, 'Roommates'), h('p', null, 'Yang lebih personal. Satu foto, satu letter rahasia. Ketuk fotomu untuk membukanya.'), h('span', { class: 'go' }, 'Buka →'))));
}

function campView() {
  const holder = h('div');
  const chips = h('div', { class: 'names', role: 'group', 'aria-label': 'Pilih nama' });
  const draw = () => {
    chips.replaceChildren(...CONFIG.campmates.map((p, i) =>
      h('button', { class: 'chip', type: 'button', 'aria-pressed': String(i === state.camp), onclick: () => { state.camp = i; draw(); } }, p.name)));
    const p = CONFIG.campmates[state.camp];
    holder.replaceChildren(letterBlock('camp:' + p.name, p.name, p.letter));
  };
  draw();
  return h('section', { class: 'screen' },
    progress(2),
    back('Kembali', chooseView),
    h('div', { class: 'page-head' }, h('p', { class: 'sticker' }, 'Campmates'), h('h2', null, 'Ini kita, geng Pare!')),
    photo(CONFIG.campPhoto, 'wide', 'Foto bareng campmates', 'foto bareng, senyum semua ya'),
    h('div', { class: 'page-head' }, h('p', { class: 'sticker' }, 'Cari namamu, lalu buka amplopnya'), chips),
    holder,
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => go(addressView) }, 'Next →')));
}

function roomView() {
  const grid = h('div', { class: 'grid' }, CONFIG.roommates.map(p =>
    h('button', { class: 'person', type: 'button', onclick: () => openLetter(p) },
      photo(p.photo, 'tall', 'Foto ' + p.name, 'foto ' + p.name),
      h('span', { class: 'name' }, p.name),
      h('span', { class: 'hint' }, 'Ketuk, ada surat!'))));
  return h('section', { class: 'screen' },
    progress(2),
    back('Kembali', chooseView),
    h('div', { class: 'page-head' }, h('p', { class: 'sticker' }, 'Roommates'), h('h2', null, 'Satu foto, satu surat')),
    grid,
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => go(addressView) }, 'Next →')));
}

function openLetter(p) {
  const prev = document.activeElement;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); if (prev) prev.focus(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const closeBtn = h('button', { class: 'close', type: 'button', onclick: close }, 'Tutup');
  const ov = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Letter untuk ' + p.name,
    onclick: e => { if (e.target === ov) close(); } },
    h('div', { class: 'sheet' }, closeBtn, letterBlock('room:' + p.name, p.name, p.letter)));
  document.body.append(ov);
  document.addEventListener('keydown', onKey);
  closeBtn.focus();
}

/* ---------- address ---------- */
function addressText(d) {
  return ['Nama: ' + d.name, d.phone ? 'WhatsApp: ' + d.phone : '', 'Alamat: ' + d.address, 'Kota/Kecamatan: ' + d.city, 'Kode pos: ' + d.postcode, d.note ? 'Catatan: ' + d.note : '']
    .filter(Boolean).join('\n');
}
function addressView() {
  const statusBox = h('div');
  const nextBtn = h('button', { class: 'btn', type: 'button', onclick: () => go(finaleView) }, 'Lanjut ke bagian akhir →');
  const field = (id, label, opts = {}) => h('label', { for: id }, h('span', null, label, opts.optional ? h('span', { class: 'opt' }, ' (opsional)') : null),
    opts.area ? h('textarea', { id, name: id, rows: '3', required: !opts.optional, autocomplete: opts.ac, placeholder: opts.ph || '' })
              : h('input', { id, name: id, type: opts.type || 'text', required: !opts.optional, autocomplete: opts.ac, inputmode: opts.mode, placeholder: opts.ph || '' }));
  const form = h('form', null,
    field('name', 'Nama penerima', { ac: 'name' }),
    field('phone', 'Nomor WhatsApp', { optional: true, type: 'tel', ac: 'tel', mode: 'tel', ph: 'Buat kurir kalau nyasar' }),
    field('address', 'Alamat lengkap', { area: true, ac: 'street-address', ph: 'Jalan, nomor rumah, RT/RW, patokan' }),
    h('div', { class: 'row2' }, field('city', 'Kota / kecamatan', { ac: 'address-level2' }), field('postcode', 'Kode pos', { ac: 'postal-code', mode: 'numeric' })),
    field('note', 'Catatan untuk kurir', { optional: true, area: true, ph: 'Contoh: titip ke satpam' }),
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'submit', id: 'save' }, 'Simpan alamat'), h('button', { class: 'btn ghost', type: 'button', onclick: () => go(finaleView) }, 'Lewati dulu')));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(form);
    const d = { name: f.get('name').trim(), phone: (f.get('phone') || '').trim(), address: f.get('address').trim(), city: f.get('city').trim(),
      postcode: f.get('postcode').trim(), note: (f.get('note') || '').trim(), group: state.group, savedAt: new Date().toISOString() };
    const btn = form.querySelector('#save'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    let saved = false;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (db && user) { const uid = await user.id(); await db.doc('addresses/' + uid).set(d); saved = true; }
    } catch (err) { saved = false; }
    btn.disabled = false; btn.textContent = 'Simpan ulang';
    if (saved) burstAt(btn, 22);
    statusBox.replaceChildren(saved
      ? h('div', { class: 'status ok' }, h('strong', null, 'Yeay, alamatmu sudah tersimpan! '), 'Kalau ada yang salah, isi lagi dan simpan ulang.', h('div', { class: 'actions', style: 'margin-top:14px' }, nextBtn))
      : h('div', { class: 'status' }, h('strong', null, 'Alamatnya belum bisa tersimpan otomatis. '), 'Salin alamat di bawah ini dan kirim langsung ke aku lewat chat ya.',
          h('pre', null, addressText(d)),
          h('div', { class: 'actions', style: 'margin-top:14px' },
            h('button', { class: 'btn ghost', type: 'button', onclick: async ev => {
              const b = ev.currentTarget;
              try { await navigator.clipboard.writeText(addressText(d)); b.textContent = 'Tersalin!'; }
              catch (_) { const r = document.createRange(); r.selectNodeContents(statusBox.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Teks terpilih, salin manual'; }
            } }, 'Salin alamat'), nextBtn)));
  });

  return h('section', { class: 'screen' },
    progress(3),
    back('Kembali', state.group === 'camp' ? campView : roomView),
    h('div', { class: 'page-head' }, h('p', { class: 'sticker' }, 'Tinggal sedikit lagi'), h('h2', null, 'Hadiahnya aku kirim ke mana nih?')),
    h('p', { style: 'max-width:52ch' }, 'Ada sesuatu yang mau aku kirim buat kamu. Isi alamat yang paling gampang dijangkau kurir ya. Cuma aku yang bisa baca.'),
    form, statusBox);
}

/* ---------- finale ---------- */
function rain() {
  if (reduce) return;
  for (let k = 0; k < 5; k++) setTimeout(() => burst(window.innerWidth * (0.15 + 0.7 * Math.random()), 90 + Math.random() * 80, 18), k * 220);
}
function finaleView() {
  const F = CONFIG.finale;
  let audio = null;
  const label = h('span', { class: 't' }, F.music ? F.musicTitle : 'Musik belum ditambahkan');
  const bars = h('span', { class: 'eqbars', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i'));
  const play = h('button', { class: 'btn', type: 'button', disabled: !F.music }, '▶ Putar musik');
  if (F.music) {
    audio = new Audio(F.music); audio.loop = true;
    play.addEventListener('click', async () => {
      try {
        if (audio.paused) { await audio.play(); play.textContent = '❚❚ Jeda'; bars.classList.add('on'); }
        else { audio.pause(); play.textContent = '▶ Putar musik'; bars.classList.remove('on'); }
      } catch (_) { label.textContent = 'Musik tidak bisa diputar di sini'; }
    });
  }
  const dots = h('div', { class: 'confetti', 'aria-hidden': 'true' }, Array.from({ length: 12 }, () => h('i')));
  const again = h('button', { class: 'btn ghost', type: 'button' }, 'Konfeti lagi!');
  again.addEventListener('click', rain);
  setTimeout(() => { if (app.querySelector('.finale')) rain(); }, 500);
  return h('section', { class: 'screen finale' },
    progress(4),
    h('p', { class: 'sticker' }, 'Sampai di rumah!'),
    h('h2', null, 'Pare kerasa kayak rumah gara-gara kalian.'),
    dots,
    photo(F.photo, 'wide', 'Foto penutup', 'foto penutup'),
    h('p', { class: 'msg' }, F.message),
    h('div', { class: 'player' }, play, bars, label),
    h('div', { class: 'actions' }, again, h('button', { class: 'btn ghost', type: 'button', onclick: () => { if (audio) audio.pause(); go(homeView); } }, 'Ulang dari awal')));
}

go(homeView);
</script>

</body></html>
